services:

  db:
    image: postgres:16
    container_name: cesi-zen-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
    - "5432:5432"

    volumes:
    - db_data:/var/lib/postgresql/data

  back:
    build:
      context: ../cesi-zen-back

    container_name: cesi-zen-back

    depends_on:
    - db

    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SSL_ENABLED: "false"

    ports:
    - "8081:8080"

  front:
    build:
      context: ../cesi-zen-front

    container_name: cesi-zen-front

    depends_on:
    - back

    ports:
    - "4300:80"

volumes:
  db_data: