services:

  db:
    image: postgres:16
    container_name: cesi-zen-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
    - "5432:5432"

    volumes:
    - db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  back:
    build:
      context: ${BACK_CONTEXT:-../cesi-zen-back}

    container_name: cesi-zen-back

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SSL_ENABLED: "false"

    ports:
    - "8081:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  front:
    build:
      context: ${FRONT_CONTEXT:-../cesi-zen-front}

    container_name: cesi-zen-front

    depends_on:
    - back

    ports:
    - "4300:80"

volumes:
  db_data: